name: Windows build and tests

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore src/WindowsGuiCliGuide.sln
      - name: Build
        run: dotnet build src/WindowsGuiCliGuide.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test src/WindowsGuiCliGuide.sln --configuration Release --no-build
